# goreleaser config for go-workflow-auditlog.
#
# This is a library, not a service, so the primary release artifact is the
# GitHub Release with auto-generated, grouped changelog notes. We also build
# the demo binary (go run ./viz/example) cross-platform so users can try the
# library's output without writing code first.
#
# Usage:
#   GORELEASER_CURRENT_TAG=vX.Y.Z GOEXPERIMENT=jsonv2 goreleaser release --clean            # full release
#   GORELEASER_CURRENT_TAG=vX.Y.Z GOEXPERIMENT=jsonv2 goreleaser release --snapshot --clean  # local dry-run
#   goreleaser check                                           # validate config
#
# GORELEASER_CURRENT_TAG is REQUIRED: this is a multi-module monorepo where
# core (vX.Y.Z), viz (viz/vX.Y.Z), and live (live/vX.Y.Z) tags share one
# commit. goreleaser's git-describe picks the wrong tag (alphabetically last)
# without the override. Always pass the CORE tag.
#
# NOTE: GOEXPERIMENT=jsonv2 is set explicitly on every hook and build below so
# the release is reproducible without the caller remembering to export it. The
# library imports the stdlib encoding/json/v2 (gated behind that experiment).
#
# NOTE: goreleaser OSS executes before-hooks via direct exec.CommandContext —
# NOT through a shell (no sh -c). Inline env vars (FOO=bar cmd) and shell
# builtins (cd, &&) are therefore ineffective unless wrapped in sh -c.
# See https://goreleaser.com/customization/hooks/

version: 2

before:
  hooks:
    # Core module (workspace mode — resolves viz/live via go.work).
    - sh -c "GOEXPERIMENT=jsonv2 go mod tidy"
    - sh -c "GOEXPERIMENT=jsonv2 go vet ./..."
    - sh -c "GOEXPERIMENT=jsonv2 go test -race ./..."
    # Viz module (standalone — proves consumers can build it without go.work).
    # `tidy -e`: error-tolerant. go-output's published go.mod ships local
    # `replace => ./testhelpers` directives that resolve to an invalid zero
    # version when consumed as a dependency; plain `go mod tidy` exits 1.
    # `-e` proceeds past the unresolvable test graph while still tidying the
    # rest. See AGENTS.md "go-output testhelpers defect".
    - sh -c "cd viz && GOWORK=off GOEXPERIMENT=jsonv2 go mod tidy -e"
    - sh -c "cd viz && GOWORK=off GOEXPERIMENT=jsonv2 go vet ./..."
    - sh -c "cd viz && GOWORK=off GOEXPERIMENT=jsonv2 go test -race ./..."
    # Live module (standalone — proves consumers can build it without go.work).
    - sh -c "cd live && GOWORK=off GOEXPERIMENT=jsonv2 go mod tidy -e"
    - sh -c "cd live && GOWORK=off GOEXPERIMENT=jsonv2 go vet ./..."
    - sh -c "cd live && GOWORK=off GOEXPERIMENT=jsonv2 go test -race ./..."

builds:
  - id: demo
    main: ./viz/example
    binary: workflow-auditlog-demo
    env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=jsonv2
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    ids: [demo]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

release:
  draft: false
  # Mark v0.x releases as pre-release automatically (library is pre-1.0).
  prerelease: auto
  make_latest: true
  name_template: "{{ .Tag }}"

changelog:
  use: github
  sort: asc
  groups:
    - title: "New Features"
      regexp: '^.*feat[(\w)]*!?:.*$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*fix[(\w)]*!?:.*$'
      order: 1
    - title: "Documentation"
      regexp: '^.*docs[(\w)]*!?:.*$'
      order: 2
    - title: "Refactor"
      regexp: '^.*refactor[(\w)]*!?:.*$'
      order: 3
    - title: "Other"
      order: 999
  filters:
    exclude:
      - "^Merge"
      - "^chore:"
      - "^style:"
